archives_base_name = "shield-disruptor-26.1"

dependencies {
    minecraft "com.mojang:minecraft:26.1"

    implementation "com.terraformersmc:modmenu:18.0.0-beta.1"
    api("me.shedaniel.cloth:cloth-config-fabric:26.1.154") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // ModMenu seems to need it
    implementation "net.fabricmc.fabric-api:fabric-api:0.145.1+26.1"

    //modCompileOnly("com.github.StellarWind22:Fabric-Shield-Lib:${project.fabric_shield_lib_version}")
    runtimeOnly("org.apache.maven:maven-artifact:${property("maven_artifact")}")
}

// Minecraft 1.21 uses Java 21
tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

project.loom {
    runs {
        client {
            client()
            setConfigName("Fabric 26.1+ Client")
            ideConfigGenerated(true)
            runDir("run/client-261")
        }
    }
}