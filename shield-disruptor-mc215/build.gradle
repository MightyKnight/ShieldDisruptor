archives_base_name = "shield-disruptor-1.21.5"

dependencies {
    minecraft "com.mojang:minecraft:1.21.5"
    mappings "net.fabricmc:yarn:1.21.5+build.1:v2"

    modImplementation "com.terraformersmc:modmenu:14.0.0-rc.2"
    modApi("me.shedaniel.cloth:cloth-config-fabric:18.0.145") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // ModMenu seems to need it
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.128.0+1.21.5"
    runtimeOnly("org.apache.maven:maven-artifact:${property("maven_artifact")}")
}

// Minecraft 1.18 upwards uses Java 17
tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

project.loom {
    runs {
        client {
            client()
            setConfigName("Fabric 1.21.5+ Client")
            ideConfigGenerated(true)
            runDir("run/client-215")
        }
    }
}