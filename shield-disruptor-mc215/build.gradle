archives_base_name = "shield-disruptor-1.21.5"

dependencies {
    minecraft "com.mojang:minecraft:1.21.8"
    mappings "net.fabricmc:yarn:1.21.8+build.1:v2"

    implementation "com.terraformersmc:modmenu:15.0.0-beta.3"
    api("me.shedaniel.cloth:cloth-config-fabric:19.0.147") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // ModMenu seems to need it
    implementation "net.fabricmc.fabric-api:fabric-api:0.129.0+1.21.8"

    //modCompileOnly("com.github.StellarWind22:Fabric-Shield-Lib:${project.fabric_shield_lib_version}")
    runtimeOnly("org.apache.maven:maven-artifact:${property("maven_artifact")}")
}

// Minecraft 1.21 uses Java 21
tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

project.loom {
    runs {
        client {
            client()
            setConfigName("Fabric 1.21.5+ Client")
            ideConfigGenerated(true)
            runDir("run/client-215")
        }
    }
}